<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);background:#3a8fd9}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.45 Onest,system-ui,sans-serif;background:linear-gradient(170deg,#3a8fd9,#9ad3f0);background-attachment:fixed;transition:background .6s}
main{max-width:520px;margin:0 auto;padding:16px 18px 40px}
.search{display:flex;gap:8px;position:relative}
input{flex:1;min-width:0;border:0;border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);background:var(--glass);outline:none}
input::placeholder{color:var(--mute)}
input:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button{font:inherit;color:var(--ink);background:var(--glass);border:0;border-radius:14px;padding:10px 14px;cursor:pointer}
.res{position:absolute;top:50px;left:0;right:0;z-index:5;background:rgba(20,30,45,.96);border-radius:14px;overflow:hidden}
.res button{display:block;width:100%;text-align:left;border-radius:0;background:none;padding:12px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0 0;padding-bottom:4px}
.chips button{white-space:nowrap;font-size:14px;padding:6px 12px}
.gate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.gate button{padding:26px 10px;font-size:17px;font-weight:600}
.demo{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);font-size:13px}
.city{margin:26px 0 0;font-weight:500;font-size:18px}
.temp{font:300 88px/1 Unbounded,Onest,sans-serif;margin:6px 0 4px;letter-spacing:-.04em}
.sub{color:var(--mute);margin:0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 0}
.facts div{background:var(--glass);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mute)}
.facts svg{display:block;margin:0 auto 4px;width:20px;height:20px;color:var(--ink)}.facts b{display:block;color:var(--ink);font-size:16px;font-weight:600}
h2{font:500 20px/1.25 Unbounded,Onest,sans-serif;margin:34px 0 6px}
.band{color:var(--mute);margin:0 0 14px;font-size:14px}
.look{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.look li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:11px 0 11px 14px}
.look span{display:flex;justify-content:center;padding-top:2px}
.look small{display:block;color:var(--mute);font-size:13px}.look .alt{margin-top:4px;font-style:italic}.tag{font-style:normal;font-weight:600;font-size:12px;padding:2px 9px;border-radius:99px;margin-left:8px}.tag.n{background:#fff;color:#1b2a3a}.tag.o{background:rgba(255,255,255,.25);color:#fff}.tag.x{border:1px solid var(--line)}
.notes{margin:22px 0 0;display:grid;gap:8px}
.notes p{margin:0;padding:11px 14px;background:var(--glass);border-radius:14px;font-size:14px}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.parts div{background:var(--glass);border-radius:16px;padding:12px 10px;font-size:13px}
.parts b{display:block;font:500 22px Unbounded,Onest,sans-serif;margin:2px 0 6px}
.parts small{color:var(--mute);display:block;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>

 document.body.style.background=`linear-gradient(170deg,${t[0]},${t[1]})`;document.documentElement.style.background=t[0];document.querySelector('meta[name=theme-color]').content=t[0];}
function notes(w){const n=[],m=new Date().getMonth()+1;
 if(w.hum>=80&&w.ap<12)n.push(`Влажность ${w.hum}%: сырой холод пробирает сильнее. Образ подобран как для температуры на 2° ниже ощущаемой. Хлопок у тела быстро отсыреет, лучше шерсть или синтетика.`);

 if(w.pp>=50||rain(w.code))n.push(`Дождь (вероятность ${w.pp}%): мембранная куртка или плащ, непромокаемая обувь, складной зонт.`);
 if(snow(w.code))n.push('Снег: обувь с глубоким протектором и мембраной, куртка с капюшоном, запасные сухие носки.');
 if(w.gust>=40)n.push(`Порывы до ${Math.round(w.gust)} км/ч: ветрозащитный верх с высоким воротником, шапка и шарф даже при плюсовой температуре.`);
 if(w.dp<=-4)n.push(`Давление падает на ${Math.abs(Math.round(w.dp))} гПа за 3 часа: возможен резкий фронт. Держите ветро- и влагозащитный слой под рукой.`);
 if(w.uv>=5)n.push(`УФ-индекс ${Math.round(w.uv)}: очки, головной убор, SPF 30+ на лицо и руки.`);

 const e=adj(w.ap,w.hum),k=kOf(e),L=fem(K[k+6],k),AC=accs(k,w);sky(w);
 const parts=w.parts.map((p,i)=>{const kk=kOf(adj(p,w.hum));return `<div><small>${['Утро','День','Вечер'][i]}</small><b>${f(p)}°</b>${esc(K[kk+6][1])}</div>`}).join('');
 $('#app').innerHTML=(w.live?'':'<p class="demo">Демо-данные по Москве. Здесь нет доступа к Open-Meteo, поэтому выбор города не работает: на вашем хостинге он заработает с живой погодой.</p>')+
 `<p class="city">${esc(w.city)}</p><p class="temp">${f(w.t)}°</p><p class="sub">${WTXT(w.code)}, ощущается как ${f(w.ap)}°</p>
 <div class="facts"><div>${FI[0]}<b>${w.hum}%</b>влажность</div><div>${FI[1]}<b>${Math.round(w.pres*.75006)}</b>мм рт. ст.</div><div>${FI[2]}<b>${Math.round(w.gust)}</b>порывы, км/ч</div><div>${FI[3]}<b>${Math.round(w.uv)}</b>УФ</div></div>
 <h2>Что надеть</h2><p class="band">${e<w.ap?`Влажность ${w.hum}% усиливает холод (${f(e-w.ap)}°), поэтому образ подобран как для ${f(e)}°`:e>w.ap?`Влажность ${w.hum}% усиливает жару (+${Math.round(e-w.ap)}°), поэтому образ подобран как для ${f(e)}°`:`Образ подобран по ощущаемой температуре ${f(e)}°`}. Диапазон ${bandName(k)}.</p>
 <ul class="look">${L.map((t,i)=>`<li><span>${ICON[i+1]}</span><div><small>${LBL[i]}</small>${esc(t)}<small class="alt">Аналог: ${esc(ALT(k)[i])}</small></div></li>`).join('')}</ul>
 <h2>Головной убор, носки, шарф</h2><p class="band">Пометка показывает, нужна ли вещь в такую погоду</p>
 <ul class="look">${AC.map((x,i)=>`<li${x.s==='x'?' style="opacity:.65"':''}><span>${ICON[AI[i]]}</span><div><small>${AL[i]}<em class="tag ${x.s}">${TG[x.s]}</em></small>${esc(x.t)}${x.s!=='x'&&ALA(k)[i]?`<small class="alt">Аналог: ${esc(ALA(k)[i])}</small>`:''}</div></li>`).join('')}</ul>
 <h2>Особенности сегодня</h2><div class="notes">${notes(w).map(t=>`<p>${esc(t)}</p>`).join('')||'<p>Особых предупреждений нет.</p>'}</div>
 <h2>Верхняя одежда в течение дня</h2><div class="parts">${parts}</div>`;}
const DEMO={city:'Москва',lat:55.75,lon:37.62,elev:150,t:6,ap:3,hum:88,pres:1004,dp:-7,gust:38,uv:1,pp:70,code:61,day:true,tmax:8,tmin:2,parts:[1,5,3],live:false};
async function load(lat,lon,city){
 try{const c=new AbortController();setTimeout(()=>c.abort(),7000);
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,surface_pressure,wind_gusts_10m,weather_code,is_day&hourly=apparent_temperature,surface_pressure,precipitation_probability,uv_index&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2`;
  const d=await (await fetch(u,{signal:c.signal})).json(),cu=d.current,h=parseInt(cu.time.slice(11,13)),H=d.hourly;
  const day=H.uv_index.slice(0,24);
  render({city,lat,lon,elev:d.elevation,t:cu.temperature_2m,ap:cu.apparent_temperature,hum:cu.relative_humidity_2m,pres:cu.surface_pressure,dp:H.surface_pressure[h+3]-H.surface_pressure[h],gust:cu.wind_gusts_10m,uv:Math.max(...day),pp:Math.max(...H.precipitation_probability.slice(h,24)),code:cu.weather_code,day:!!cu.is_day,tmax:d.daily.temperature_2m_max[0],tmin:d.daily.temperature_2m_min[0],parts:[8,14,20].map(i=>H.apparent_temperature[i]),live:true});
  try{localStorage.setItem('last',JSON.stringify({lat,lon,city}))}catch(e){}
 }catch(e){render(DEMO)}}
async function find(name){
 try{const r=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=5&language=ru`)).json();return r.results||[]}catch(e){return null}}
const res=$('#res');
$('#q').addEventListener('keydown',async ev=>{if(ev.key!=='Enter')return;const n=ev.target.value.trim();if(!n)return;
 const r=await find(n);if(r===null){load(0,0,n);return}
 res.innerHTML=r.length?r.map((x,i)=>`<button data-i="${i}">${esc(x.name)}, ${esc(x.admin1||x.country||'')}</button>`).join(''):'<button disabled>Ничего не найдено</button>';res.hidden=false;
 res.onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;const x=r[b.dataset.i];res.hidden=true;load(x.latitude,x.longitude,x.name)}});
$('#geo').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>load(p.coords.latitude,p.coords.longitude,'Моё местоположение'),()=>{});
$('#chips').innerHTML=['Москва','Сочи','Якутск','Франкфурт','Бангкок','Дубай'].map(c=>`<button>${c}</button>`).join('');
$('#chips').onclick=async e=>{if(e.target.tagName!=='BUTTON')return;const r=await find(e.target.textContent);r&&r[0]?load(r[0].latitude,r[0].longitude,r[0].name):load(0,0,e.target.textContent)};
$('#app').addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;G=b.dataset.g;try{localStorage.setItem('g',G)}catch(x){}LW&&render(LW)});
$('#prof').onclick=()=>{G=null;LW&&render(LW)};
let last=null;try{last=JSON.parse(localStorage.getItem('last'))}catch(e){}
last?load(last.lat,last.lon,last.city):load(DEMO.lat,DEMO.lon,DEMO.city);
</script>
</body>
